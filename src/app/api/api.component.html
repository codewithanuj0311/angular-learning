<div class="container my-4">
    <div class="product-wrapper">
  
      <!-- Heading -->
      <h1 class="text-center page-title">Manage Products</h1>
  
      <hr>
  
      <div class="row g-5">
  
        <!-- Add Product -->
        <div class="col-md-6">
          <h2 class="section-title">Add Products</h2>
  
          <div class="mb-3">
            <label for="productId" class="form-label">Product Id</label>
            <input
              type="text"
              id="productId"
              class="form-control"
              [(ngModel)]="productId"
              placeholder="Enter product id">
          </div>
  
          <div class="mb-3">
            <label for="productName" class="form-label">Product Name</label>
            <input
              type="text"
              id="productName"
              class="form-control"
              [(ngModel)]="productName"
              placeholder="Enter product name">
          </div>
  
          <div class="mb-3">
            <label for="productPrice" class="form-label">Product Price</label>
            <input
              type="number"
              id="productPrice"
              class="form-control"
              [(ngModel)]="productPrice"
              placeholder="Enter product price">
          </div>
  
          <button
            class="btn btn-primary"
            (click)="addProduct()">
            Add Product
          </button>
          <button
            class="btn btn-success"
            (click)="saveProduct()">
            Save Product
          </button>
          <button
            class="btn btn-light"
            (click)="fetchProduct()">
            Fetch Product
          </button>
        </div>
  
  
        <!-- Products -->
        <div class="col-md-6">
          <h2 class="section-title">{{dataTitle | async}}</h2>
  
          <div class="table-responsive">
            <table class="table product-table">
              <thead>
                <tr>
                  <th>#</th>
                  <th>Id</th>
                  <th>Name</th>
                  <th>Price</th>
                  <th>Delete</th>
                </tr>
              </thead>
  
              <tbody *ngIf="!fetching">
                <tr *ngFor="let product of products; let i = index">
                  <th>{{ i + 1 }}</th>
                  <td>{{ product.id }}</td>
                  <td>{{ product.name }}</td>
                  <td>{{ product.price }}</td>
                  <td>
                    <button
                      class="btn btn-sm btn-delete"
                      (click)="deleteProduct(i)"
                      title="Delete product">
                      🗑️
                    </button>
                  </td>
                </tr>
              </tbody>
            </table>
            <div *ngIf="fetching" class="text-center">
                <div class="spinner-border text-warning"></div>
                Fetching Products...</div>
          </div>
  
        </div>
  
      </div>
    </div>
  </div>
