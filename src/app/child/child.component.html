<div class="col-md-12 bg-success text-center text-white py-4">
    <h2 *ngIf="!productSelected; else elseblock">Please select any product</h2>
    <ng-template #elseblock>
        <h2>{{selectProduct}} is selected!</h2>
    </ng-template>
    
    <button class="btn btn-secondary" (click)="addToCart()">Add to Cart</button>
</div>
